# Grabit — AI Code Review via PR-Agent (Qodo)
#
# Runs an automated code review on every pull request using PR-Agent.
# Model: DeepSeek-V4 via an OpenAI-compatible endpoint (OpenCode / OpenRouter).
# API key is read from the OPENAI_API_KEY secret — never hardcoded.
#
# Review focus: bugs, security, error handling, TypeScript best practices,
# and architecture consistency. PR-Agent reviews only the changed files in the PR.

name: AI Code Review (PR-Agent)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Safer than pull_request_target: runs with the PR merge ref but no repo
    # secrets are exposed to untrusted PR code from forks (PR-Agent uses the
    # GITHUB_TOKEN with read/write on pull-requests only).

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-agent-review:
    name: Review changed files
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent review
        uses: qodo-ai/pr-agent@main
        env:
          # --- GitHub ---
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTION.AUTO_REVIEW: "true"
          GITHUB_ACTION.AUTO_DESCRIBE: "false"
          GITHUB_ACTION.AUTO_IMPROVE: "false"

          # --- Model: DeepSeek-V4 via OpenAI-compatible endpoint ---
          # OPENAI_API_KEY is the endpoint's API key (OpenRouter/DeepSeek/OpenCode).
          # OPENAI.API_BASE points at the endpoint; DEEPSEEK_V4 model name
          # must match what the endpoint expects (adjust below if needed).
          OPENAI.KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI.API_BASE: ${{ secrets.OPENAI_API_BASE }}
          PR_REVIEWER.MODEL: "deepseek/deepseek-chat-v4"
          CONFIG.MODEL: "deepseek/deepseek-chat-v4"

          # --- Review behaviour ---
          # Medium effort = balanced depth vs. cost/latency.
          CONFIG.MAX_DESCRIPTION_MARKDOWN_LENGTH: "0"
          PR_REVIEWER.NUM_CODE_SUGGESTIONS: "6"
          PR_REVIEWER.INCREASED_REVIEW_INSIGHTS: "false"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: >-
            Focus on: bugs, security issues, error handling, TypeScript best
            practices, and architecture consistency. This is a pnpm monorepo
            (TypeScript Hono API + BullMQ workers, Python FastAPI AI agent,
            Prisma + Postgres). Only review files changed in this PR.
